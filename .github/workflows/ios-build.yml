name: iOS Build (.ipa)

# Baut die Blackhole-App auf einem macOS-Runner und legt eine UNSIGNIERTE
# .ipa als Download-Artefakt ab. Diese .ipa installierst du mit Sideloadly
# oder AltStore, die sie mit deiner eigenen Apple-ID signieren (kein Mac nötig).

on:
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:   # erlaubt manuelles Auslösen im Actions-Tab

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode auswählen
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        working-directory: ios-app
        run: xcodegen generate

      - name: App bauen (ohne Signatur)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild \
            -project Blackhole.xcodeproj \
            -scheme Blackhole \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: In .ipa verpacken
        working-directory: ios-app
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Blackhole.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build-Produkt nicht gefunden unter $APP_PATH"; exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Blackhole-unsigned.ipa Payload >/dev/null
          echo "IPA erstellt:"; ls -lh Blackhole-unsigned.ipa

      - name: .ipa als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Blackhole-unsigned-ipa
          path: ios-app/Blackhole-unsigned.ipa
          if-no-files-found: error
